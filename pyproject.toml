# This file configures development tooling (ruff) and records the runtime
# dependency. The repository ships a Claude Skill, not an installable Python
# distribution, so there is deliberately no [build-system] table — `pip install .`
# is not a supported workflow. The skill installs its own venv via run.sh/run.ps1.
[project]
name = "slidepack-skills"
version = "0.1.0"
description = "Claude Skills for comparing PPTX files at the OOXML level"
requires-python = ">=3.10"
dependencies = [
    "lxml==5.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.8.4",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

# Settings for `ruff format`, which is deliberately not run against this codebase:
# it uses column alignment that the formatter collapses (~550 lines of churn).
# Recorded here so the style is defined if the project adopts the formatter later.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
